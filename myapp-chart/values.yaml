# Количество реплик
replicaCount: 1

# Образы контейнеров
image:
  nginx:
    repository: nginx
    tag: latest
    pullPolicy: IfNotPresent
  multitool:
    repository: wbitt/network-multitool
    tag: latest
    pullPolicy: IfNotPresent

# Параметры multitool
multitool:
  httpPort: 8080

# Имя приложения (будет использоваться в метках)
nameOverride: ""
fullnameOverride: ""

# Service
service:
  type: ClusterIP
  port: 80
  multitoolPort: 8080

# Ресурсы
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Стратегия обновления
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
serviceAccount:
  create: true
  name: ""
ingress:
  enabled: false
httpRoute:
  enabled: false
# Сервис аккаунт
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Политики безопасности (опционально)
podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# HTTPRoute (для Gateway API)
httpRoute:
  enabled: false

# Автоскейлинг
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Дополнительные настройки
nodeSelector: {}
tolerations: []
affinity: {}

# Разделение образов
imagePullSecrets: []
