apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myapp-chart.fullname" . }}
  labels:
    {{- include "myapp-chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "myapp-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "myapp-chart.labels" . | nindent 8 }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.nginx.repository }}:{{ .Values.image.nginx.tag }}"
          imagePullPolicy: {{ .Values.image.nginx.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
        - name: multitool
          image: "{{ .Values.image.multitool.repository }}:{{ .Values.image.multitool.tag }}"
          imagePullPolicy: {{ .Values.image.multitool.pullPolicy }}
          ports:
            - name: http-multitool
              containerPort: {{ .Values.multitool.httpPort }}
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: "{{ .Values.multitool.httpPort }}"
